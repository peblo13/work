<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Workplanetjobs.com</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .cv-container { max-width: 800px; margin: 0 auto; }
        .back-btn { background: #0ff1ce; color: black; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .cv-content { background: #f9f9f9; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="cv-container">
        <button class="back-btn" onclick="window.history.back()">← Powrót do bazy CV</button>
        
        <!-- Google AdSense Banner -->
        <div class="ad-container banner-top">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="6677889900"
                 data-ad-format="horizontal"
                 data-full-width-responsive="true"></ins>
        </div>
        
        <div class="cv-content" id="cvContent">
            <!-- CV content will be loaded here -->
        </div>
    </div>

    <script>
        // Get CV ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const cvId = parseInt(urlParams.get('id'));

        // Sample CV data (same as in bazacv.html)
        const allCVs = [
            {
                id: 1,
                name: "Anna Kowalska",
                position: "Frontend Developer",
                location: "Warszawa",
                experience: "3-5",
                education: "Wyższe",
                salary: "8000-12000",
                skills: ["JavaScript", "React", "CSS", "HTML", "TypeScript"],
                summary: "Doświadczona frontend developerka z pasją do tworzenia nowoczesnych interfejsów użytkownika. Specjalizuje się w React i nowoczesnych technologiach webowych.",
                yearsExp: "4 lata",
                email: "anna.kowalska@example.com",
                phone: "+48 123 456 789",
                addedDate: "2024-01-15"
            },
            {
                id: 2,
                name: "Marcin Nowak",
                position: "Backend Developer",
                location: "Kraków",
                experience: "5-10",
                education: "Magisterskie",
                salary: "12000-20000",
                skills: ["Python", "Django", "PostgreSQL", "Docker", "AWS"],
                summary: "Senior backend developer z 7-letnim doświadczeniem w budowaniu skalowalnych aplikacji. Expert w Python i architekturze mikrousług.",
                yearsExp: "7 lat",
                email: "marcin.nowak@example.com",
                phone: "+48 987 654 321",
                addedDate: "2024-01-14"
            },
            // Add other CVs here...
        ];

        // Find and display CV
        const cv = allCVs.find(c => c.id === cvId);
        if (cv) {
            document.getElementById('cvContent').innerHTML = `
                <h1>${cv.name}</h1>
                <h2>${cv.position}</h2>
                <p><strong>Lokalizacja:</strong> ${cv.location}</p>
                <p><strong>Doświadczenie:</strong> ${cv.yearsExp}</p>
                <p><strong>Wykształcenie:</strong> ${cv.education}</p>
                <p><strong>Umiejętności:</strong> ${cv.skills.join(', ')}</p>
                <p><strong>Opis:</strong> ${cv.summary}</p>
                <p><strong>Email:</strong> ${cv.email}</p>
                <p><strong>Telefon:</strong> ${cv.phone}</p>
                <p><strong>Oczekiwania wynagrodzenia:</strong> ${cv.salary} zł</p>
            `;
        } else {
            document.getElementById('cvContent').innerHTML = '<p>CV nie znalezione.</p>';
        }
    </script>
</body>
</html>
